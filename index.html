<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yeshiva Ketana Token Store</title>
    <script>
      (() => {
        const canonicalHost = 'yeshiva-ketana-secure.vercel.app'
        const branchHosts = new Set([
          'school-dashboard-git-yeshiva-keta-e6b2e0-akiva-klein-s-projects.vercel.app',
        ])

        if (branchHosts.has(window.location.host)) {
          window.location.replace(`${window.location.protocol}//${canonicalHost}${window.location.pathname}${window.location.search}${window.location.hash}`)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
